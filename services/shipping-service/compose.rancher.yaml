services:
  shipping-service:
    build: ../services/shipping-service
    image: shipping-service:dev
    profiles: [full-shop]
    environment:
      DB_HOST: postgres
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?Run deploy/create-secrets.sh}
      RABBITMQ_HOST: rabbitmq
      SHIPPING_RABBITMQ_PASSWORD: ${SHIPPING_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      CONSUL_URL: http://consul:8500
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      consul-kv-seed:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8089/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
