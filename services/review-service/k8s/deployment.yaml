apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: shop
  labels:
    app: review-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: review-service
          image: review-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: review-service-config
          env:
            # sekrety: tworzone ręcznie, patrz README (kubectl create secret)
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: review-service-secret
                  key: MONGODB_URL
            # adres poda i nazwa instancji (rejestracja w Consulu, nagłówek X-Instance-Id)
            - name: SERVICE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
