apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
  namespace: shop
  labels:
    app: inventory-service
data:
  SERVICE_NAME: "inventory-service"
  SERVICE_PORT: "8084"
  LOG_LEVEL: "INFO"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: "inventory-service"
  CONSUL_ENABLED: "true"
  CONSUL_HOST: "consul"
  CONSUL_PORT: "8500"
