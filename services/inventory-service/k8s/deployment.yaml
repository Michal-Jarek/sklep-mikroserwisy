apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: shop
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-service
          image: inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: inventory-service-config
          env:
            # sekrety: tworzone ręcznie, patrz README (kubectl create secret)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inventory-service-secret
                  key: DATABASE_URL
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-service-secret
                  key: RABBITMQ_PASSWORD
            # adres poda (rejestracja w Consulu); ID instancji to domyślnie <usługa>-<hostname>
            - name: SERVICE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
