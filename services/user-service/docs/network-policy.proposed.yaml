apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service
  namespace: shop
spec:
  podSelector: {matchLabels: {app: user-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
        - podSelector: {matchLabels: {app: auth-service}}
        - podSelector: {matchLabels: {app: notification-service}}
        - podSelector: {matchLabels: {app: consul}}
      ports: [{protocol: TCP, port: 8082}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app: user-postgres}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector: {matchLabels: {app: consul}}
      ports: [{protocol: TCP, port: 8500}]
