apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: user-service}
  template:
    metadata:
      labels: {app: user-service}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: user-service
          image: user-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8082}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - name: SERVICE_ADDRESS
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: DB_HOST
              value: user-postgres
            - name: DB_NAME
              value: user_db
            - name: DB_USER
              value: user_service
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: user-db-secret, key: password}
            - name: CONSUL_URL
              value: http://consul:8500
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 768Mi}
          startupProbe:
            httpGet: {path: /health/live, port: 8082}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: 8082}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8082}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: shop
spec:
  type: ClusterIP
  selector: {app: user-service}
  ports: [{port: 8082, targetPort: 8082}]
