apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cart-service
  namespace: shop
spec:
  podSelector: {matchLabels: {app: cart-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
        - podSelector: {matchLabels: {app: order-service}}
        - podSelector: {matchLabels: {app: consul}}
      ports: [{protocol: TCP, port: 8085}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {app: cart-redis}}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector: {matchLabels: {app: product-service}}
      ports: [{protocol: TCP, port: 8083}]
    - to:
        - podSelector: {matchLabels: {app: inventory-service}}
      ports: [{protocol: TCP, port: 8084}]
    - to:
        - podSelector: {matchLabels: {app: consul}}
      ports: [{protocol: TCP, port: 8500}]
