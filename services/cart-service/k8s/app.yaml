apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: cart-service}
  template:
    metadata:
      labels: {app: cart-service}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: cart-service
          image: cart-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8085}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - name: SERVICE_ADDRESS
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: INSTANCE_ID
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: {name: cart-redis-secret, key: url}
            - name: CONSUL_URL
              value: http://consul:8500
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 768Mi}
          startupProbe:
            httpGet: {path: /health/live, port: 8085}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: 8085}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8085}
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: shop
spec:
  type: ClusterIP
  selector: {app: cart-service}
  ports: [{port: 8085, targetPort: 8085}]
