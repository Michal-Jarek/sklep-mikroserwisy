  labels:
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: review-service}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # api-gateway -> review-service 8088: /api/v1/reviews/**.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: api-gateway}
        # product-service -> review-service 8088: rating of a product.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: product-service}
        # consul -> review-service 8088: health check.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: consul}
      ports: [{protocol: TCP, port: 8088}]
  egress:
    # review-service -> mongo 27017: review_db.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: mongo}
      ports: [{protocol: TCP, port: 27017}]
