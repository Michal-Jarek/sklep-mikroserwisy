    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: order-service}
      ports: [{protocol: TCP, port: 8086}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: notification-service}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # api-gateway -> notification-service 8087: /api/v1/notifications/**.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: api-gateway}
        # consul -> notification-service 8087: health check.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: consul}
      ports: [{protocol: TCP, port: 8087}]
  egress:
    # notification-service -> mongo 27017: notification_db.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: mongo}
      ports: [{protocol: TCP, port: 27017}]
    # notification-service -> rabbitmq 5672: receiver of notification.q.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: rabbitmq}
      ports: [{protocol: TCP, port: 5672}]
    # notification-service -> mailpit 1025: e-mails over SMTP.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: mailpit}
      ports: [{protocol: TCP, port: 1025}]
    # notification-service -> consul-guard 8500 (Service consul).
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: consul-guard}
      ports: [{protocol: TCP, port: 8500}]
    # notification-service -> user-service 8082: e-mail address and first name of the customer.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: user-service}
      ports: [{protocol: TCP, port: 8082}]
---
# order-service (stage 8, prepared ahead).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: network
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: order-service}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # api-gateway -> order-service 8086: /api/v1/orders/**.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: api-gateway}
        # review-service -> order-service 8086: GET /orders/purchased.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: review-service}
        # consul -> order-service 8086: health check.
        - podSelector:
            matchLabels: {app.kubernetes.io/name: consul}
      ports: [{protocol: TCP, port: 8086}]
  egress:
    # order-service -> postgres 5432: order_db.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports: [{protocol: TCP, port: 5432}]
    # order-service -> rabbitmq 5672: publishes order.*, receiver of order.q.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: rabbitmq}
      ports: [{protocol: TCP, port: 5672}]
    # order-service -> consul-guard 8500 (Service consul).
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: consul-guard}
      ports: [{protocol: TCP, port: 8500}]
    # order-service -> cart-service 8085: reads and clears the cart.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: cart-service}
      ports: [{protocol: TCP, port: 8085}]
    # order-service -> inventory-service 8084: reservations.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: inventory-service}
      ports: [{protocol: TCP, port: 8084}]
    # order-service -> shipping-service 8089: shipment of the order.
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: shipping-service}
      ports: [{protocol: TCP, port: 8089}]
    # order-service -> product-service 8083: product data for the order (D4).
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: product-service}
      ports: [{protocol: TCP, port: 8083}]
---
# Job order-migrate -> postgres 5432 (stage 8, prepared ahead; name by the <service>-migrate convention).
