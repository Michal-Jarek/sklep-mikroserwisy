# Every pod in shop: no incoming and no outgoing connection unless another NetworkPolicy of this directory
# allows it (NetworkPolicies add up). The other files allow DNS and the connections of the connection table
# (deploy/k8s/README.md, section "NetworkPolicy"). k3s (kube-router) rejects a blocked connection at once
# ("connection refused"). Traffic from the node (kubelet probes, kubectl port-forward) is always allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: network
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
