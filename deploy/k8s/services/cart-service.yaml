# Cart Service (owner: Karola): shopping carts in redis-cart, prices and stock from Product and Inventory
# (found through Consul). Variables 1:1 with deploy/compose.yaml; REDIS_URL contains the password, so it
# comes from Secret cart-service-secret (deploy/k8s/secrets.sh). Registers itself in Consul with the pod IP
# (SERVICE_ADDRESS) and the pod name (INSTANCE_ID).
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: shop
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
  ports:
    - {name: http, port: 8085, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: shop
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-service
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-service
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: service
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT=tcp://... variables from the other Services of the namespace (convention, see README).
      enableServiceLinks: false
      # preStop (10 s) + deregistration from Consul and closing the server on SIGTERM (decision 11).
      terminationGracePeriodSeconds: 30
      securityContext:
        # USER 1000:1000 of the image.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      # Z12/Z13: with NetworkPolicy active, a new pod cannot connect for ~1-2 s (kube-router adds its IP to the
      # rule sets with a delay). Wait here until consul:8500 answers (every 0.5 s, at most 30 s, then exit 1 and
      # the pod restarts), so the service reads Consul KV and registers on its first try.
      initContainers:
        - name: wait-for-network
          image: cart-service:dev
          imagePullPolicy: Never
          command:
            - python
            - -c
            - |
              import socket, sys, time
              start = time.monotonic()
              while True:
                  try:
                      socket.create_connection(("consul", 8500), 1).close()
                      print(f"consul:8500 reachable after {time.monotonic() - start:.1f} s")
                      break
                  except OSError as exc:
                      if time.monotonic() - start > 30:
                          print(f"consul:8500 not reachable after 30 s: {exc}", file=sys.stderr)
                          sys.exit(1)
                      time.sleep(0.5)
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: cart-service
          image: cart-service:dev
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8085}
          env:
            - {name: PORT, value: "8085"}
            - {name: CONSUL_URL, value: "http://consul:8500"}
            # Address and ID registered in Consul (decision 5). Without INSTANCE_ID the code would use
            # "cart-service-" + hostname, i.e. a doubled prefix (the pod name already starts with cart-service).
            - name: SERVICE_ADDRESS
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: cart-service-secret, key: REDIS_URL}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # The image sets PYTHONDONTWRITEBYTECODE; uvicorn writes nothing outside /tmp.
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Redis answers (2 s socket timeout, hence 3 s).
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            # Others keep the instance list from Consul for up to 10 s: serve while they switch over.
            preStop:
              sleep: {seconds: 10}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
