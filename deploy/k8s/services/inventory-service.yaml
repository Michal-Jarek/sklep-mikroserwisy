# Inventory Service (owner: Aleksandra): stock and reservations in inventory_db, consumer of inventory.q (RabbitMQ).
# Variables 1:1 with deploy/compose.yaml; DATABASE_URL (contains the password) and RABBITMQ_PASSWORD from Secret
# inventory-service-secret (deploy/k8s/secrets.sh). The service creates its tables at start (stock_items,
# stock_reservations, processed_events; old tables are not read), hence the 120 s startupProbe. It registers in
# Consul with the pod IP (SERVICE_ADDRESS) and the pod name (INSTANCE_ID, also the RabbitMQ connection name) and
# registers again when the entry disappears.
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: shop
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
  ports:
    - {name: http, port: 8084, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: shop
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: service
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT=tcp://... variables from the other Services of the namespace (convention, see README).
      enableServiceLinks: false
      # preStop (10 s) + deregistration from Consul and closing the server on SIGTERM (decision 11).
      terminationGracePeriodSeconds: 30
      securityContext:
        # USER 10001 of the image (no group in the Dockerfile; the application files are world-readable).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # Z12/Z13: with NetworkPolicy active, a new pod cannot connect for ~1-2 s (kube-router adds its IP to the
      # rule sets with a delay). Wait here until consul:8500 answers (every 0.5 s, at most 30 s, then exit 1 and
      # the pod restarts), so the service reads Consul KV and registers on its first try.
      initContainers:
        - name: wait-for-network
          image: inventory-service:dev
          imagePullPolicy: Never
          command:
            - python
            - -c
            - |
              import socket, sys, time
              start = time.monotonic()
              while True:
                  try:
                      socket.create_connection(("consul", 8500), 1).close()
                      print(f"consul:8500 reachable after {time.monotonic() - start:.1f} s")
                      break
                  except OSError as exc:
                      if time.monotonic() - start > 30:
                          print(f"consul:8500 not reachable after 30 s: {exc}", file=sys.stderr)
                          sys.exit(1)
                      time.sleep(0.5)
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: inventory-service
          image: inventory-service:dev
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8084}
          env:
            - {name: SERVICE_PORT, value: "8084"}
            - {name: CONSUL_HOST, value: consul}
            - {name: CONSUL_PORT, value: "8500"}
            # Full instance ID = pod name (decision 9); address registered in Consul = pod IP.
            - name: INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: SERVICE_ADDRESS
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: inventory-service-secret, key: DATABASE_URL}}
            - {name: RABBITMQ_HOST, value: rabbitmq}
            - {name: RABBITMQ_PORT, value: "5672"}
            - {name: RABBITMQ_USER, value: inventory-service}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: inventory-service-secret, key: RABBITMQ_PASSWORD}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # The image sets PYTHONDONTWRITEBYTECODE; uvicorn writes nothing outside /tmp.
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          # Up to 120 s: the HTTP server starts only after the schema is created in PostgreSQL.
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Database ping with a 2 s limit inside the service; the broker does not affect readiness.
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            # Others keep the instance list from Consul for up to 10 s: serve while they switch over.
            preStop:
              sleep: {seconds: 10}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
