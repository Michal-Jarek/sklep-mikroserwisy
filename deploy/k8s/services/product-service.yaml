# Product Service (owner: micbanavio): catalogue in product_db, ratings from Review and stock from Inventory
# (found through Consul). Variables 1:1 with deploy/compose.yaml; password from Secret product-service-secret
# (deploy/k8s/secrets.sh). Registers itself in Consul with the pod IP (SERVICE_ADDRESS) and the pod name
# (INSTANCE_ID). The schema comes from Job product-migrate (product-migrate.yaml), which deploy/k8s/up.sh
# runs first. HPA 1-3 (decision 15); demo of three copies: deploy/k8s/README.md.
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: shop
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
  ports:
    - {name: http, port: 8083, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shop
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
spec:
  # Kept although the HPA below manages the count (as in api-gateway.yaml): the first up.sh creates one pod
  # and waits for it before the HPA takes over.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: service
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT=tcp://... variables from the other Services of the namespace (convention, see README).
      enableServiceLinks: false
      # preStop (10 s) + deregistration from Consul and closing the server on SIGTERM (decision 11).
      terminationGracePeriodSeconds: 30
      securityContext:
        # USER 10001 of the image (no group in the Dockerfile; the application files are world-readable).
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # Z12/Z13: with NetworkPolicy active, a new pod cannot connect for ~1-2 s (kube-router adds its IP to the
      # rule sets with a delay). Wait here until consul:8500 answers (every 0.5 s, at most 30 s, then exit 1 and
      # the pod restarts), so the service reads Consul KV and registers on its first try.
      initContainers:
        - name: wait-for-network
          image: product-service:dev
          imagePullPolicy: Never
          command:
            - python
            - -c
            - |
              import socket, sys, time
              start = time.monotonic()
              while True:
                  try:
                      socket.create_connection(("consul", 8500), 1).close()
                      print(f"consul:8500 reachable after {time.monotonic() - start:.1f} s")
                      break
                  except OSError as exc:
                      if time.monotonic() - start > 30:
                          print(f"consul:8500 not reachable after 30 s: {exc}", file=sys.stderr)
                          sys.exit(1)
                      time.sleep(0.5)
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: product-service
          image: product-service:dev
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8083}
          env:
            - {name: PORT, value: "8083"}
            - {name: CONSUL_HOST, value: consul}
            - {name: CONSUL_PORT, value: "8500"}
            # Address and ID registered in Consul (decision 5). Without INSTANCE_ID the code would use
            # "product-service-" + hostname, i.e. a doubled prefix (the pod name already starts with product-service).
            - name: SERVICE_ADDRESS
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: DB_HOST, value: postgres}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: product_db}
            - {name: DB_USER, value: product_service}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: product-service-secret, key: DB_PASSWORD}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # The image sets PYTHONDONTWRITEBYTECODE; uvicorn writes nothing outside /tmp.
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Database ping (2 s connect timeout, hence 3 s).
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            # Others keep the instance list from Consul for up to 10 s: serve while they switch over.
            preStop:
              sleep: {seconds: 10}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
# 1-3 pods by CPU (70 % of requests.cpu = 35m per pod); scale down after 60 s without load (decision 15).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: product-service
  namespace: shop
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: product-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
