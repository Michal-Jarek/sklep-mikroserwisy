# Shop frontend: nginx serves the React app (SPA) on port 8080. Same image and variables as the frontend entry of
# deploy/compose.yaml; in Kubernetes the Ingress sends /api straight to api-gateway and / to this Service
# (deploy/k8s/platform/ingress.yaml). Not registered in Consul.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: platform
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/component: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: platform
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT=tcp://... variables from the other Services of the namespace (convention, see README).
      enableServiceLinks: false
      # Default 30 s; nginx of the image stops on SIGQUIT (graceful: open requests are finished).
      terminationGracePeriodSeconds: 30
      securityContext:
        # USER 101 (nginx) of frontend/Dockerfile.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: frontend:dev
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            # The DNS server of /etc/resolv.conf (kube-dns) for the resolver of the /api/ location.
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
            # Full DNS name: the nginx resolver does not use the search domains of resolv.conf. Through the Ingress
            # /api never reaches this pod, but the template needs the variable and the location stays usable.
            - name: GATEWAY_URL
              value: http://api-gateway.shop.svc.cluster.local:8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # The image entrypoint writes conf.d/default.conf from /etc/nginx/templates, nginx writes its pid and
            # temporary files to /tmp (emptyDir below). Without a writable conf.d the entrypoint cannot replace the
            # default.conf of the base image.
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            # Not in Consul, so no 10 s like the services. Traefik drops the pod from its backends a moment after
            # the endpoint stops being ready; the short pause keeps nginx listening until then (no refused
            # connections during a rollout of the single replica).
            preStop:
              sleep: {seconds: 5}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          emptyDir: {sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
