# The only way into the shop from outside: Traefik of k3s (kube-system, entry points web :80 and websecure :443 on
# every interface of the laptop). https://shop.localhost/api -> api-gateway, everything else -> frontend.
# HTTP answers only with a permanent redirect to HTTPS. Certificate: Secret shop-tls (mkcert, deploy/k8s/secrets.sh).
# No errors middleware: a 503 of Traefik itself (no ready Gateway replica) reaches the client as plain text,
# see deploy/k8s/README.md and D7 in docs/decisions.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shop-hsts
  namespace: shop
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: platform
spec:
  # Strict-Transport-Security: max-age=31536000 on every HTTPS answer (frontend and Gateway). No includeSubDomains
  # and no preload: the shop has no subdomains and a .localhost name cannot be on the preload list.
  headers:
    stsSeconds: 31536000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shop-https-redirect
  namespace: shop
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: platform
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # <namespace>-<middleware name>@kubernetescrd
    traefik.ingress.kubernetes.io/router.middlewares: shop-shop-hsts@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [shop.localhost]
      secretName: shop-tls
  rules:
    - host: shop.localhost
      http:
        paths:
          # Traefik matches pathType Prefix as a plain text prefix: /api, /api/... and also e.g. /apidocs go to the
          # Gateway (404 there for anything outside /api/v1). The path is passed unchanged; the Gateway strips /api/v1.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: {number: 8080}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-http
  namespace: shop
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: platform
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: shop-shop-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: shop.localhost
      http:
        paths:
          # The redirect middleware answers before the backend is called; the backend is only required by Ingress.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 8080}
