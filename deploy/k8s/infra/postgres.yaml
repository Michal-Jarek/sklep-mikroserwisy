# PostgreSQL for auth, user, product, inventory, order and shipping (one database and role per service,
# created by deploy/postgres/init/01-service-databases.sh from ConfigMap postgres-init on an empty volume).
# Passwords from Secret postgres-secret (created by deploy/k8s/secrets.sh). Same behaviour as in deploy/compose.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shop
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: infra
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shop
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: infra
spec:
  # The ClusterIP Service above; no headless Service: clients use the Service name, nobody needs
  # the per-pod DNS name of a single replica.
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/component: infra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: infra
    spec:
      automountServiceAccountToken: false
      # No <SERVICE>_PORT=tcp://... variables from the other Services of the namespace (convention, see README).
      enableServiceLinks: false
      securityContext:
        # User postgres of the image (uid/gid 70); fsGroup makes the volumes writable for it.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        # Change ownership only on the first (empty) mount, not on every pod start (see rabbitmq.yaml).
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            # A subdirectory of the volume: initdb needs an empty directory owned by the server user,
            # and the root of a fresh volume is neither (lost+found, owner root).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}
            - name: AUTH_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: AUTH_DB_PASSWORD}}
            - name: USER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: USER_DB_PASSWORD}}
            - name: PRODUCT_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: PRODUCT_DB_PASSWORD}}
            - name: INVENTORY_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: INVENTORY_DB_PASSWORD}}
            - name: ORDER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: ORDER_DB_PASSWORD}}
            - name: SHIPPING_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-secret, key: SHIPPING_DB_PASSWORD}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            # Writes only to the data volume, the socket directory and /tmp (emptyDir below).
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          # With -h: during init scripts the server listens only on the socket, so ready only after them.
          # The startup probe covers the init (up to 120 s); liveness starts after it.
          startupProbe:
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"]}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Executable bit required: without it the image entrypoint sources the script instead of running it.
        - name: init
          configMap: {name: postgres-init, defaultMode: 0755}
        - name: run
          emptyDir: {sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: shop
          app.kubernetes.io/component: infra
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
