# Shared shop infrastructure: Consul (+ KV seeding), PostgreSQL, Redis for the Gateway
# and RabbitMQ (+ topology and service accounts from deploy/rabbitmq/).
# Started by default: docker compose -f deploy/compose.yaml up -d --wait
# Services are added in profiles "platform" (from stage 2) and "full-shop" (stage 5).
# Ports only on 127.0.0.1. Passwords from deploy/.env (created by deploy/create-secrets.sh).
name: sklep

services:
  consul:
    image: hashicorp/consul:1.21
    # Whole container without root. The variable disables su-exec in the image entrypoint,
    # which fails without root ("setgroups(1000): Operation not permitted").
    user: consul
    environment:
      CONSUL_DISABLE_PERM_MGMT: "true"
    # -bind=127.0.0.1: the container is in two networks; without it Consul does not start.
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-node=consul", "-bind=127.0.0.1", "-client=0.0.0.0"]
    networks: [backend, tools]
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - consul-data:/consul/data
    healthcheck:
      # Healthy once a leader is elected (response contains an address, not an empty string).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8500/v1/status/leader | grep -q '[0-9]'"]
      interval: 2s
      timeout: 3s
      retries: 30

  # On every "up" overwrites config/<service>/data with deploy/consul/config/<service>.yaml.
  consul-kv-seed:
    image: hashicorp/consul:1.21
    # The image does not drop root for "sh", so the user is set explicitly.
    user: consul
    command: ["sh", "/kv/seed-kv.sh"]
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    networks: [backend]
    volumes:
      - ./consul:/kv:ro
    # The image declares VOLUME /consul/data: without tmpfs every new container of this one-off
    # service leaves an anonymous volume behind.
    tmpfs: [/consul/data]
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/create-secrets.sh}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run deploy/create-secrets.sh}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Run deploy/create-secrets.sh}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Run deploy/create-secrets.sh}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run deploy/create-secrets.sh}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Run deploy/create-secrets.sh}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend, tools]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # With -h: during init scripts the server listens only on the socket, so healthy only after them.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-gateway:
    image: redis:7.4-alpine
    # "sh -c" skips the privilege drop in the image, so the user is set explicitly (no root).
    user: redis
    # "up --wait" fails when a fast one-off container (consul-kv-seed, rabbitmq-setup) exits
    # before it is checked. These dependencies make Compose wait for them, and a failure stops "up".
    depends_on:
      consul-kv-seed:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    environment:
      REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Run deploy/create-secrets.sh}
    # No persistence: rate limit counters are ephemeral.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save \"\" --appendonly no"]
    # The image declares VOLUME /data: without tmpfs every new container leaves an anonymous
    # volume behind (nothing is written there, see above).
    tmpfs: [/data]
    networks: [backend, tools]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    # Whole container without root, also for the healthcheck and "docker compose exec":
    # a CLI tool run as root creates root's .erlang.cookie and the broker fails with eacces.
    user: rabbitmq
    # The node name rabbit@<hostname> selects the data directory in the volume,
    # so a fixed hostname keeps the data when the container is recreated.
    hostname: rabbitmq
    # The admin account is created only on an empty volume; no guest account is created.
    # Topology and service accounts: rabbitmq-setup (not load_definitions, which creates no accounts).
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend, tools]
    # 5672 AMQP, 15672 management UI and HTTP API.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # On every "up" imports deploy/rabbitmq/definitions.json and the service accounts (setup.sh).
  # Adds what is missing and updates policies, accounts and permissions; existing queues and
  # exchanges are skipped without an error (changing the type or arguments of a queue needs
  # a clean start). Never deletes.
  rabbitmq-setup:
    image: rabbitmq:4.3-management-alpine
    user: rabbitmq
    command: ["sh", "/setup/setup.sh"]
    environment:
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?Run deploy/create-secrets.sh}
      AUTH_RABBITMQ_PASSWORD: ${AUTH_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      NOTIFICATION_RABBITMQ_PASSWORD: ${NOTIFICATION_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      INVENTORY_RABBITMQ_PASSWORD: ${INVENTORY_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      SHIPPING_RABBITMQ_PASSWORD: ${SHIPPING_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      ORDER_RABBITMQ_PASSWORD: ${ORDER_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend]
    volumes:
      - ./rabbitmq:/setup:ro
    # The image declares VOLUME /var/lib/rabbitmq: without tmpfs every new container of this one-off
    # service leaves an anonymous volume behind.
    tmpfs: [/var/lib/rabbitmq]
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # One-off: applies Auth Service database migrations (prisma migrate deploy), then exits.
  # auth-service starts only after it succeeds, so with --scale the migration still runs once.
  auth-migrate:
    image: auth-service:dev
    build: ../services/auth-service
    profiles: [platform, full-shop]
    user: node
    # The Prisma CLI is called directly: npx would try to write its cache.
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_db
      DB_USER: auth_service
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # No ports: reachable only inside the backend network (from stage 3 through the Gateway).
  auth-service:
    image: auth-service:dev
    build: ../services/auth-service
    profiles: [platform, full-shop]
    user: node
    environment:
      PORT: "8081"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_db
      DB_USER: auth_service
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run deploy/create-secrets.sh}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      # First admin account, created at startup when it does not exist yet.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sklep.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run deploy/create-secrets.sh}
      # Until stage 5 (User Service in Compose) registration does not call User Service.
      USER_SERVICE_ENABLED: "false"
      # Publishing events (outbox relay); Auth starts and registers users without RabbitMQ.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: auth-service
      RABBITMQ_PASSWORD: ${AUTH_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
    volumes:
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      consul-kv-seed:
        condition: service_completed_successfully
      auth-migrate:
        condition: service_completed_successfully
      # Start order only (topology and account exist); not required later.
      rabbitmq-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # The only service with a published port: the entry point to the backend (http://localhost:8080).
  # Does not depend on auth-service: public routes work without it, the others answer 503.
  api-gateway:
    image: api-gateway:dev
    build: ../services/api-gateway
    profiles: [platform, full-shop]
    user: node
    environment:
      PORT: "8080"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      REDIS_HOST: redis-gateway
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Run deploy/create-secrets.sh}
    # backend: Consul, Redis and the services; edge: entry from outside (published port).
    networks: [backend, edge]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      consul:
        condition: service_healthy
      consul-kv-seed:
        condition: service_completed_successfully
      redis-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

networks:
  # Infrastructure and all services; no outbound access.
  backend: { internal: true }
  # From stage 3: Gateway and frontend (entry from outside).
  edge: {}
  # Only infrastructure containers with a port on 127.0.0.1 (an internal network does not publish ports).
  tools: {}

volumes:
  consul-data: {}
  postgres-data: {}
  rabbitmq-data: {}
