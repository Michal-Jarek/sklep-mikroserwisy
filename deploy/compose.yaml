# Shared shop infrastructure: Consul (+ KV seeding), PostgreSQL, Redis for the Gateway,
# RabbitMQ (+ topology and service accounts from deploy/rabbitmq/), MongoDB (Review, Notification),
# Redis for Cart and Mailpit (SMTP + web UI for emails).
# Started by default: docker compose -f deploy/compose.yaml up -d --wait
# Services are added in profiles "platform" (Gateway, Auth, frontend) and "full-shop"
# (team services are added when their PR is merged).
# Ports only on 127.0.0.1. Passwords from deploy/.env (created by deploy/create-secrets.sh).
name: sklep

services:
  consul:
    image: hashicorp/consul:1.21
    # Whole container without root. The variable disables su-exec in the image entrypoint,
    # which fails without root ("setgroups(1000): Operation not permitted").
    user: consul
    environment:
      CONSUL_DISABLE_PERM_MGMT: "true"
    # -bind=127.0.0.1: the container is in two networks; without it Consul does not start.
    command: ["agent", "-server", "-bootstrap-expect=1", "-ui", "-node=consul", "-bind=127.0.0.1", "-client=0.0.0.0"]
    networks: [backend, tools]
    ports:
      - "127.0.0.1:8500:8500"
    volumes:
      - consul-data:/consul/data
    healthcheck:
      # Healthy once a leader is elected (response contains an address, not an empty string).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8500/v1/status/leader | grep -q '[0-9]'"]
      interval: 2s
      timeout: 3s
      retries: 30

  # On every "up" overwrites config/<service>/data with deploy/consul/config/<service>.yaml.
  consul-kv-seed:
    image: hashicorp/consul:1.21
    # The image does not drop root for "sh", so the user is set explicitly.
    user: consul
    command: ["sh", "/kv/seed-kv.sh"]
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
    networks: [backend]
    volumes:
      - ./consul:/kv:ro
    # The image declares VOLUME /consul/data: without tmpfs every new container of this one-off
    # service leaves an anonymous volume behind.
    tmpfs: [/consul/data]
    restart: "no"
    depends_on:
      consul:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/create-secrets.sh}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run deploy/create-secrets.sh}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Run deploy/create-secrets.sh}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Run deploy/create-secrets.sh}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run deploy/create-secrets.sh}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Run deploy/create-secrets.sh}
      SHIPPING_DB_PASSWORD: ${SHIPPING_DB_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend, tools]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # With -h: during init scripts the server listens only on the socket, so healthy only after them.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-gateway:
    image: redis:7.4-alpine
    # "sh -c" skips the privilege drop in the image, so the user is set explicitly (no root).
    user: redis
    # "up --wait" fails when a fast one-off container (consul-kv-seed, rabbitmq-setup) exits
    # before it is checked. These dependencies make Compose wait for them, and a failure stops "up".
    depends_on:
      consul-kv-seed:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    environment:
      REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Run deploy/create-secrets.sh}
    # No persistence: rate limit counters are ephemeral.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save \"\" --appendonly no"]
    # The image declares VOLUME /data: without tmpfs every new container leaves an anonymous
    # volume behind (nothing is written there, see above).
    tmpfs: [/data]
    networks: [backend, tools]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    # Whole container without root, also for the healthcheck and "docker compose exec":
    # a CLI tool run as root creates root's .erlang.cookie and the broker fails with eacces.
    user: rabbitmq
    # The node name rabbit@<hostname> selects the data directory in the volume,
    # so a fixed hostname keeps the data when the container is recreated.
    hostname: rabbitmq
    # The admin account is created only on an empty volume; no guest account is created.
    # Topology and service accounts: rabbitmq-setup (not load_definitions, which creates no accounts).
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend, tools]
    # 5672 AMQP, 15672 management UI and HTTP API.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # On every "up" imports deploy/rabbitmq/definitions.json and the service accounts (setup.sh).
  # Adds what is missing and updates policies, accounts and permissions; existing queues and
  # exchanges are skipped without an error (changing the type or arguments of a queue needs
  # a clean start). Never deletes.
  rabbitmq-setup:
    image: rabbitmq:4.3-management-alpine
    user: rabbitmq
    command: ["sh", "/setup/setup.sh"]
    environment:
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?Run deploy/create-secrets.sh}
      AUTH_RABBITMQ_PASSWORD: ${AUTH_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      NOTIFICATION_RABBITMQ_PASSWORD: ${NOTIFICATION_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      INVENTORY_RABBITMQ_PASSWORD: ${INVENTORY_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      SHIPPING_RABBITMQ_PASSWORD: ${SHIPPING_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
      ORDER_RABBITMQ_PASSWORD: ${ORDER_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend]
    volumes:
      - ./rabbitmq:/setup:ro
    # The image declares VOLUME /var/lib/rabbitmq: without tmpfs every new container of this one-off
    # service leaves an anonymous volume behind.
    tmpfs: [/var/lib/rabbitmq]
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # One server for Review and Notification: database <s>_db and user <s>_service per service
  # (created by deploy/mongo/init/ on an empty volume), like PostgreSQL.
  mongo:
    image: mongo:8.0
    # Whole container without root, also the healthcheck and "docker compose exec"
    # (the image itself drops root only for mongod).
    user: mongodb
    # The default WiredTiger cache is half of the VM memory minus 1 GB (~2.4 GB on a 6 GB VM);
    # 256 MB is enough here. --noscripting disables server-side JavaScript ($where, $function,
    # mapReduce with JS): the services do not need it, and an injected query operator cannot run code.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--noscripting"]
    # The admin account is created only on an empty volume (like RabbitMQ). The service passwords
    # are read by deploy/mongo/init/01-service-users.js.
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run deploy/create-secrets.sh}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?Run deploy/create-secrets.sh}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend, tools]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    # The image declares VOLUME /data/configdb (unused without a replica set): without tmpfs every
    # new container leaves an anonymous volume behind. uid/gid of user mongodb: otherwise the
    # directory belongs to root and mongod does not start.
    tmpfs:
      - /data/configdb:uid=999,gid=999
    healthcheck:
      # Through the container hostname, not localhost: during init scripts the image runs a temporary
      # mongod on 127.0.0.1 only, so healthy only after them.
      # mongosh is a Node process (~0.3 s CPU per run): every 2 s it kept ~12-15 % of a core busy,
      # so every 10 s after the start; start_interval checks every 1 s during start_period, so
      # "up --wait" still sees healthy right after init. HOME=/tmp: mongosh writes its logs to
      # $HOME/.mongodb, and the HOME of user mongodb is /data/db (the data volume).
      test: ["CMD-SHELL", "HOME=/tmp mongosh --quiet --host \"$$(hostname)\" --eval 'db.adminCommand(\"ping\").ok' | grep -q 1"]
      interval: 10s
      start_interval: 1s
      start_period: 60s
      timeout: 5s
      retries: 3

  # Redis for Cart Service: a separate server and password, so Cart and the Gateway do not see
  # each other's data.
  redis-cart:
    image: redis:7.4-alpine
    # "sh -c" skips the privilege drop in the image, so the user is set explicitly (no root).
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_CART_PASSWORD:?Run deploy/create-secrets.sh}
    # Carts are customer data: append-only file on the volume, so they survive a restart.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    networks: [backend, tools]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-cart-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local SMTP server with a web UI for the emails of Notification Service. Sends nothing out.
  # Messages are kept in memory and are lost on restart.
  mailpit:
    image: axllent/mailpit:v1.32
    # The image runs as root by default; no data on disk, so any non-root user works.
    user: "1000:1000"
    # Web UI and API answer only these Host headers (403 otherwise), so a web page cannot read the
    # emails through DNS rebinding to 127.0.0.1. Also from other containers: mailpit:8025 -> 403.
    # SMTP is not affected.
    environment:
      MP_ALLOWED_HOSTS: "localhost:8025,127.0.0.1:8025"
    networks: [backend, tools]
    # 8025 web UI and API, 1025 SMTP (no TLS, no login).
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-off: applies Auth Service database migrations (prisma migrate deploy), then exits.
  # auth-service starts only after it succeeds, so with --scale the migration still runs once.
  auth-migrate:
    image: auth-service:dev
    build: ../services/auth-service
    profiles: [platform, full-shop]
    user: "1000:1000"
    # The Prisma CLI is called directly: npx would try to write its cache.
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_db
      DB_USER: auth_service
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run deploy/create-secrets.sh}
    networks: [backend]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # No ports: reachable only inside the backend network (from stage 3 through the Gateway).
  auth-service:
    image: auth-service:dev
    build: ../services/auth-service
    profiles: [platform, full-shop]
    user: "1000:1000"
    environment:
      PORT: "8081"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: auth_db
      DB_USER: auth_service
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run deploy/create-secrets.sh}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      # First admin account, created at startup when it does not exist yet.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sklep.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run deploy/create-secrets.sh}
      # Until User Service is in Compose (added when its PR is merged) registration does not call User Service.
      USER_SERVICE_ENABLED: "false"
      # Publishing events (outbox relay); Auth starts and registers users without RabbitMQ.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: auth-service
      RABBITMQ_PASSWORD: ${AUTH_RABBITMQ_PASSWORD:?Run deploy/create-secrets.sh}
    volumes:
      - ./secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
      consul-kv-seed:
        condition: service_completed_successfully
      auth-migrate:
        condition: service_completed_successfully
      # Start order only (topology and account exist); not required later.
      rabbitmq-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # The entry point to the backend (http://localhost:8080; the frontend forwards /api/ here too).
  # Does not depend on auth-service: public routes work without it, the others answer 503.
  api-gateway:
    image: api-gateway:dev
    build: ../services/api-gateway
    profiles: [platform, full-shop]
    user: "1000:1000"
    environment:
      PORT: "8080"
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      REDIS_HOST: redis-gateway
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?Run deploy/create-secrets.sh}
      # X-Forwarded-For (client IP for the limits and the services) is trusted only on a connection from the
      # frontend container (its nginx replaces the header); from anyone else the connection address counts.
      TRUSTED_PROXIES: frontend
    # backend: Consul, Redis and the services; edge: entry from outside (published port).
    networks: [backend, edge]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      consul:
        condition: service_healthy
      consul-kv-seed:
        condition: service_completed_successfully
      redis-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Shop in the browser: nginx serves the React app and forwards /api/ to the Gateway
  # (one address for the app and the API, no CORS). http://127.0.0.1:8090
  frontend:
    image: frontend:dev
    build: ../frontend
    profiles: [platform, full-shop]
    user: "101:101"
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
      GATEWAY_URL: http://api-gateway:8080
    networks: [edge]
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # Infrastructure and all services; no outbound access.
  backend: { internal: true }
  # From stage 3: Gateway and frontend (entry from outside).
  edge: {}
  # Only infrastructure containers with a port on 127.0.0.1 (an internal network does not publish ports).
  tools: {}

volumes:
  consul-data: {}
  postgres-data: {}
  rabbitmq-data: {}
  mongo-data: {}
  redis-cart-data: {}
